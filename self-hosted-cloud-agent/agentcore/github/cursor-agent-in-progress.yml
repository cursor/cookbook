# Kick a Cursor Cloud Agent on the AgentCore self-hosted pool when an
# `agent-*` issue moves to In Progress on https://github.com/users/skopp002/projects/2
#
# Required repo secrets:
#   CURSOR_API_KEY     Cursor service account key (same value as the AgentCore worker)
#   GH_PROJECT_TOKEN   Fine-grained PAT with Projects: Read (user skopp002) and
#                      repository access to this repo. GITHUB_TOKEN cannot read user projects.
#
# The AgentCore worker session must already be HealthyBusy or the job waits in the pool.
name: Cursor agent on In Progress

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to start immediately (optional)"
        required: false
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  kickoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Cursor Cloud Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CURSOR_POOL_NAME: agentcore-platform-agents
          PROJECT_OWNER: skopp002
          PROJECT_NUMBER: "2"
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: python3 .github/scripts/kick_cursor_agent.py
