# Template GitHub Actions workflow for the AgentCore lab in cursor-cookbook.
# Copy this file into the *sample repo* Cloud Agents should clone and PR against
# (this cookbook is the worker/runtime, not that sample repo).
#
# kaushalavardhanam/kaushalavardhanam is the example sample repo used to
# demonstrate Cloud Agent capacity. It is not a required production app.
#   https://github.com/kaushalavardhanam/kaushalavardhanam
#   https://github.com/orgs/kaushalavardhanam/projects/1
# Replace PROJECT_OWNER, PROJECT_NUMBER, and the PAT scopes for your sample repo.
#
# Required repo secrets on the sample repo:
#   CURSOR_API_KEY     Cursor service account key (same value as the AgentCore worker)
#   GH_PROJECT_TOKEN   Fine-grained PAT: Projects: Read on the org/user that owns the
#                      board, plus repository access. GITHUB_TOKEN cannot read Projects v2.
#
# The AgentCore worker session must already be HealthyBusy or the job waits in the pool.
name: Cursor agent on In Progress

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to start immediately (optional)"
        required: false
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  kickoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Cursor Cloud Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CURSOR_POOL_NAME: agentcore-platform-agents
          PROJECT_OWNER: kaushalavardhanam
          PROJECT_OWNER_TYPE: organization
          PROJECT_NUMBER: "1"
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: python3 .github/scripts/kick_cursor_agent.py
